server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/mod_catalog
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: validate # Важливо: відключаємо генерацію таблиць Hibernate
    show-sql: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
  quartz:
    job-store-type: jdbc
    overwrite-existing-jobs: true
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: mod-catalog-scheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: false
      org.quartz.threadPool.threadCount: 3
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: mod-client
            client-secret: 0ERAKvKAbeMf3roVNChyiJVFE5YbFb4emS4TRX4P67gnTDkFQKLllFrsLA8hc6kNpSU88dvGJIBHsWQ4EjU6aP
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: http://localhost:18080/realms/mod-realm
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18080/realms/mod-realm
app:
  async:
    email-delay-ms: 1000
    pdf-delay-ms: 1000
    rating-delay-ms: 1000
    report-timeout-ms: 5000
  scheduler:
    time-zone: Europe/Kyiv
    report-daily-cron: "0/30 * * * * ?"
    report-weekly-cron: "0 0 3 ? * MON"
    cleanup-cron: "0 30 3 * * ?"
